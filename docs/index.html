<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Degen Signals 5R</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d1117"><link rel="icon" href="icon.svg">
<style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;margin:0;padding:14px;max-width:900px;margin:auto}a{color:#58a6ff}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px;margin:10px 0}.pos{color:#3fb950}.neg{color:#f85149}
.disc{background:#3d1d1d;border:1px solid #f85149;padding:8px;border-radius:6px}small{color:#8b949e}button{background:#238636;color:#fff;border:0;padding:6px 10px;border-radius:5px}</style></head>
<body><h2>🎯 Degen Signals: 5R hunter</h2>
<div class="disc">⚠️ <b>NOT FINANCIAL ADVICE.</b> Automated heuristics on extremely risky memecoins. Most go to zero. DYOR.</div>
<div class="card" id="pnl"><b>📊 PnL &amp; win rate</b> <small>(loading…)</small></div>
<p><small id="meta">Loading…</small> <button id="inst" hidden>Install app</button></p><h3>📒 Signal journal</h3><div id="stats" class="card"></div>
<div style="overflow-x:auto"><table id="jr" style="width:100%;border-collapse:collapse;font-size:13px"></table></div>
<h3>Latest signals</h3><div id="list"></div>
<script>
const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":(+n).toFixed(0), esc=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
async function load(){ try{ const d=await (await fetch("signals.json?t="+Date.now())).json();
  document.getElementById("meta").textContent=`Updated ${new Date(d.updatedAt*1000).toLocaleString()} · window ${d.window} · ${d.candidates} scanned, ${d.cheapPass} near-pass`+(d.lastRunErrors?.length?` · ⚠ ${d.lastRunErrors.length} lookup errors last run`:"");
  document.getElementById("list").innerHTML=d.tokens.length?d.tokens.map(r=>`<div class="card"><b>$${esc(r.symbol)}</b> ${esc(r.name)} <small>${new Date(r.signalAt*1000).toLocaleString()}</small><br>
  MC $${fmt(r.mcap)} · Liq $${fmt(r.liq)} · Vol ${r.window} $${fmt(r.vol)} · <span class="${r.ch5m<0?'neg':'pos'}">5m ${r.ch5m}%</span> · <span class="${r.ch1h<0?'neg':'pos'}">1h ${r.ch1h}%</span> · ${r.buys}B/${r.sells}S · age ${r.ageH}h<br>
  Top10 ${r.top10Pct}% · Cluster ${r.clusterPct}% (${esc(r.clusterSource)})${r.extras?` · fees≈${r.extras.estFeesSol??"?"} SOL · max holder ${r.extras.maxSingleHolderPct}% · fresh ${r.extras.freshWallets}/10`:""}<br>
  <small>${r.chartAth?.mc?`🏔 Chart ATH MC <b>$${fmt(r.chartAth.mc)}</b> · `:""}🔐 LP ${esc(r.lp?.label||"n/a")}</small><br>
  <small>${r.firstScan?`First scan MC $${fmt(r.firstScan.mc)} → $${fmt(r.mcap)} · `:""}Liq ${r.liqPctMc??"n/a"}% of MC · Dex Paid ${r.orders?.dexPaid===true?"✅":r.orders?.dexPaid===false?"❌":"n/a"} · CTO ${r.cto===true?"✅":r.cto===false?"❌":"n/a"}${r.holders?.top5?` · Top5 ${r.holders.top5.join("·")} [${r.holders.top5Pct}%] | ${r.holders.count??"n/a"} holders · 🐋 ${r.holders.whalePct??"n/a"}%`:""}${r.odds?.n?` · Our history: 2x ~${r.odds.x2}% / rug ~${r.odds.rug}% (n=${r.odds.n})`:""}${r.narratives?.length?` · ${esc(r.narratives.join(", "))}`:""}</small><br>
  <small>Score ${r.score??"n/a"}${r.scoreCapped?` (capped, would be ${r.scoreUncapped})`:""} · Vol24h/Liq ${r.volLiq??"n/a"}x · Bots ${r.behaviour?.botPct??"n/a"}% · Flippers ${r.behaviour?.flipperPct??"n/a"}% · Fresh≤7d ${r.behaviour?.freshPct??"n/a"}%${r.behaviour?.sampled?` <i>(${r.behaviour.source}, top ${r.behaviour.sampled})</i>`:""}</small><br>
  ${r.findings?`<small><b>🚦 ${r.findings.filter(f=>f[0]==="red").length} red, ${r.findings.filter(f=>f[0]!=="red").length} amber</b>${r.findings.map(f=>`<br>${f[0]==="red"?"🔴":"🟠"} ${esc(f[1])}`).join("")}</small><br>`:""}
  <small><b>GMGN: ${esc(r.gmgn?.status||"SKIPPED")}</b> ${esc((r.gmgn?.reasons||[]).join("; "))}</small><br>
  ${r.dev?.wallet?`<small>Dev <a href="https://solscan.io/account/${esc(r.dev.wallet)}" target=_blank>${esc(r.dev.wallet.slice(0,4))}…</a> ${r.dev.rugHistory?'<span class="neg">🚩rug history</span> ':''}${r.dev.sold?'sold':'holds '+r.dev.holdPct+'%'} · ${r.dev.priorTokens} prior (${r.dev.priorMigrated} migrated, ${r.dev.priorDead} dead) · dev score <b class="${r.devScore<0?'neg':'pos'}">${r.devScore}</b></small><br>`:""}<small>${esc(r.description)}</small><br><small>CA: ${esc(r.mint)}</small><br>
  ${Object.entries(r.links).filter(([,u])=>u).map(([k,u])=>`<a href="${esc(u)}" target=_blank>${k}</a>`).join(" · ")} · ${r.socials.map(u=>`<a href="${esc(u)}" target=_blank>social</a>`).join(" · ")}</div>`).join(""):"<p>No signals yet. The bot posts when a token passes every 5R filter.</p>";
 }catch(e){document.getElementById("meta").textContent="No signals.json yet ("+e.message+")";} }
async function loadJ(){ try{ const d=await (await fetch("signals.json?t="+Date.now())).json(), s=d.stats||{}, J=d.journal||[];
  const P=d.periodStats, pf=x=>x==null?"n/a":`<span class="${x<0?'neg':'pos'}">${x>0?"+":""}${x}%</span>`;
  if(P) document.getElementById("pnl").innerHTML=`<b>📊 PnL &amp; win rate</b> <small>(WAT periods, by alert time)</small>
   <table style="width:100%;font-size:14px;margin-top:6px"><tr><th align=left rowspan=2>Period</th><th rowspan=2>Signals</th><th colspan=3>Hold</th><th colspan=3>TP sim (50% @2x)</th><th rowspan=2>Best</th><th rowspan=2>Worst</th><th rowspan=2>Milestones</th></tr><tr><th>Win</th><th>Total</th><th>Avg</th><th>Win</th><th>Total</th><th>Avg</th></tr>`+
   [["today","Today"],["week","This week"],["month","This month"],["all","All-time"]].map(([k,l])=>{const p=P[k];return `<tr><td><b>${l}</b></td><td align=center>${p.signals}</td><td align=center><b>${p.winRate==null?"n/a":p.winRate+"%"}</b> <small>(${p.wins}/${p.n})</small></td><td align=center><b>${pf(p.totalPnl)}</b></td><td align=center>${pf(p.avgPnl)}</td><td align=center><b>${p.tpWinRate==null?"n/a":p.tpWinRate+"%"}</b> <small>(${p.tpWins??0}/${p.n})</small></td><td align=center><b>${pf(p.tpTotalPnl)}</b></td><td align=center>${pf(p.tpAvgPnl)}</td><td align=center><small>${esc(p.best||"–")}</small></td><td align=center><small>${esc(p.worst||"–")}</small></td><td align=center><small>${Object.entries(p.milestones||{"2":p.hit2x,"5":p.hit5x}).filter(([k,v])=>k==="2"||k==="5"||v).map(([k,v])=>`${k}x ${v}`).join(" · ")}</small></td></tr>`}).join("")+
   `</table><small>Total = sum of % returns per signal since alert, Avg = mean. Basis: ${esc(d.statsBasis||"")} (all-time: ${P.all.basis["24h"]} at 24h, ${P.all.basis.live} live). TP sim = sell 50% at +100% if the max gain seen reached 2x, the rest at the hold basis. Max gain is sampled about every 15 min, so real peaks may be higher or lower. Win = positive PnL. Not financial advice.</small>`;
  const f=a=>a&&a.n?`${a.n} closed · win ${a.winRate}% · avg ${a.avg>0?"+":""}${a.avg}% · best ${a.best>0?"+":""}${a.best}% · worst ${a.worst}%`:"no results yet";
  document.getElementById("stats").innerHTML=`<b>${s.signals||0}</b> signals · hit 2x: <b>${s.hit2x||0}</b> · hit 5x: <b>${s.hit5x||0}</b><br>1h: ${f(s.h1)}<br>24h: ${f(s.h24)}<br><small>Prices are sampled every ~10 min, so the max is a lower bound. Past results ≠ future. Not financial advice.</small>`;
  const pc=x=>x==null?"–":`<span class="${x<0?'neg':'pos'}">${x>0?"+":""}${x}%</span>`;
  document.getElementById("jr").innerHTML="<tr><th align=left>Token</th><th>Alert</th><th>Entry MC</th><th>Dev</th><th>Now</th><th>1h</th><th>24h</th><th>Max</th><th>ATH MC</th><th>LP</th><th>Trend</th><th></th></tr>"+
   J.map(e=>`<tr style="border-top:1px solid #30363d"><td><a href="${esc(e.link)}" target=_blank>$${esc(e.symbol)}</a></td><td>${new Date(e.t0*1000).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</td><td>$${fmt(e.mcap0)}</td><td>${e.devScore??"–"}</td><td>${pc(e.lastPct)}</td><td>${pc(e.h1?.pct)}</td><td>${pc(e.h24?.pct)}</td><td>${e.price0&&e.maxPrice?(e.maxPrice/e.price0).toFixed(2)+"x":"–"}${e.topMilestone>=2?` 🚀${e.topMilestone}x`:e.hit5x?" 🚀5x":e.hit2x?" 🚀2x":""}${e.maxSrc==="chart"?"":"<small>*</small>"}</td><td>${e.athMc?"$"+fmt(e.athMc):"–"}</td><td><small>${esc(e.lp?.label||"–")}${e.lpEvents&&Object.keys(e.lpEvents).length?' <span class="neg">⚠️ '+esc(Object.keys(e.lpEvents).join(", "))+'</span>':""}</small></td><td>${e.trend==="up"?"📈 up":e.trend==="fading"?"⚠️ fading":"–"}</td><td><a href="https://fomo.family/tokens/solana/${esc(e.mint)}" target=_blank>Fomo</a></td></tr>`).join("")+`<tr><td colspan=13><small>Max = chart high since alert (GeckoTerminal candles); * = bot-sampled only. ATH MC = all-time chart high × supply. LP from rugcheck, re-checked for 7 days.</small></td></tr>`;
 }catch(e){} }
load(); loadJ(); setInterval(()=>{load();loadJ();},60000);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
let ev; addEventListener("beforeinstallprompt",e=>{e.preventDefault();ev=e;const b=document.getElementById("inst");b.hidden=false;b.onclick=()=>ev.prompt();});
</script></body></html>
